
name: npm publish

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
  
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - uses: calcit-lang/setup-calcit@d02594b15f0e9de723fe1a202a3fa62a87afe07b # v1.4.0
        with:
          tools: calcit,caps

      - name: Install dependencies
        run: caps --strict --ci && yarn install --immutable

      - name: Validate Calcit entries and toolchain
        run: |
          caps verify --toolchain
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry page --check-only
          calcit analyze dynamic-methods --max 0 --summary-only --format json
          calcit --entry page analyze dynamic-methods --max 0 --summary-only --format json
          calcit analyze deprecated --summary-only --format json
          calcit --entry page analyze deprecated --summary-only --format json

      - run: yarn compile-server && yarn compile-page && yarn release-page
  
      # - run: mkdir -p dist-server && mv js-out/bundle.js dist-server
      #   name: Copy server scripts
  
      - name: Upload web assets
        id: deploy
        uses: Pendect/action-rsyncer@b7f90f4f8ed893d4e3f852f7a73180631f63d4bd # v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
  
      - name: Display status from deploy
        run: echo "${{ steps.deploy.outputs.status }}"
  
      # - name: Upload server script
      #   id: deploy-server
      #   uses: Pendect/action-rsyncer@v1.1.0
      #   env:
      #     DEPLOY_KEY: ${{secrets.rsync_private_key}}
      #   with:
      #     flags: '-avzr --progress'
      #     options: ''
      #     ssh_options: ''
      #     src: 'dist-server/*'
      #     dest: 'rsync-user@tiye.me:/servers/rebase-hell/'
  
      # - name: Display status from deploy
      #   run: echo "${{ steps.deploy-server.outputs.status }}"
  
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
