
name: npm publish

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org/
        cache: yarn

    - uses: calcit-lang/setup-cr@0.0.9

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - run: caps --ci && yarn install --immutable && yarn compile-page && yarn release-page

    # - run: mkdir -p dist-server && mv js-out/bundle.js dist-server
    #   name: Copy server scripts

    - name: Upload web assets
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      run: echo "${{ steps.deploy.outputs.status }}"

    # - name: Upload server script
    #   id: deploy-server
    #   uses: Pendect/action-rsyncer@v1.1.0
    #   env:
    #     DEPLOY_KEY: ${{secrets.rsync_private_key}}
    #   with:
    #     flags: '-avzr --progress'
    #     options: ''
    #     ssh_options: ''
    #     src: 'dist-server/*'
    #     dest: 'rsync-user@tiye.me:/servers/rebase-hell/'

    # - name: Display status from deploy
    #   run: echo "${{ steps.deploy-server.outputs.status }}"

    - run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{secrets.npm_token}}
