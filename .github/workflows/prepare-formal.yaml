name: Protected Termina formal migration
on:
  push:
    branches: [prepare/termina-formal-0301]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HOST: 127.0.0.1
      NO_VERSION_CHECK: "1"
      TERMINA_STORAGE_FILE: /tmp/termina-ci-synthetic-unused.cirru
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - name: Official formal dependencies and runtime-only lock update
        run: |
          set -euo pipefail
          mkdir -p acceptance
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          test "$(calcit -v)" = 0.30.1
          node inspect-formal.mjs manifests
          caps --strict --ci
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install --mode=skip-build
          yarn install --immutable
          caps verify --toolchain
          node inspect-formal.mjs
      - name: Before migration original tests and all type gates
        run: bash verify-phase.sh before
      - name: Official atomic source transaction and complete view guard
        run: node migrate-source.mjs apply
      - name: After migration same original tests and all type gates
        run: bash verify-phase.sh after
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-source
          path: |
            calcit.cirru
            yarn.lock
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics
          path: acceptance/
          if-no-files-found: warn
